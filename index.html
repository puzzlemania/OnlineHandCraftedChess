<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ancient Hindu Chess</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="gameContainer">

    <!-- ==========================================
         ORANGE ARMY
    =========================================== -->

    <aside id="orangePanel" class="armyPanel">

        <div class="panelTitle">
            Orange Army
        </div>

        <div id="orangePalette" class="piecePalette">

            <!-- Created dynamically by palette.js -->

        </div>

    </aside>


    <!-- ==========================================
         CHESS BOARD
    =========================================== -->

    <main id="boardContainer">

        <!-- Board Artwork -->

        <img
            id="boardImage"
            src="assets/board.png"
            alt="Ancient Hindu Chess Board">

        <!-- Invisible 8 × 8 Grid -->

        <div id="boardOverlay">

            <!-- Created dynamically by board.js -->

        </div>

    </main>


    <!-- ==========================================
         BLUE ARMY
    =========================================== -->

    <aside id="bluePanel" class="armyPanel">

        <div class="panelTitle">
            Blue Army
        </div>

        <div id="bluePalette" class="piecePalette">

            <!-- Created dynamically by palette.js -->

        </div>

    </aside>

</div>


<!-- ==========================================
     JavaScript
========================================== -->

<script src="js/board.js"></script>

<script src="js/palette.js"></script>

<script src="js/rules.js"></script>

<script src="js/setup.js"></script>

<script src="js/turn.js"></script>
<script src="js/game.js"></script>
<script src="js/engine.js"></script>
<script src="js/gameui.js"></script>

<script src="js/dragdrop.js"></script>

<script src="js/script.js"></script>


<!-- ==========================================
     Game Controls
=========================================== -->
<div id="gameControls">
    <label>Mode
        <select id="gameMode">
            <option value="human">Player vs Player</option>
            <option value="computer">Player vs Computer</option>
        </select>
    </label>
    <label>Computer
        <select id="computerArmy">
            <option value="orange">Orange</option>
            <option value="blue">Blue</option>
        </select>
    </label>
    <label>Level
        <select id="engineLevel">
            <option value="1">Easy</option>
            <option value="2" selected>Medium</option>
            <option value="3">Hard</option>
        </select>
    </label>
    <button id="resetGame">New Game</button>
    <span id="gameStatus">Blue to move</span>
</div>

<!-- Pawn promotion dialog -->
<div id="promotionOverlay">
    <div id="promotionDialog">
        <h2 id="promotionTitle">Pawn Promotion</h2>
        <p>Choose the piece for the promoted pawn.</p>
        <div id="promotionChoices"></div>
    </div>
</div>

</body>

</html>
